<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings — Tersimpan — RetortLogger</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="app-page">
  <div class="mock-banner hidden">MOCKUP DOKUMENTASI</div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="settings.html" class="active">Settings</a>
    <a href="storage.html">Log &amp; Storage</a>
    <a href="login.html">Logout</a>
  </nav>
  <div class="m narrow">
    <h1>Settings</h1>
    <div id="msg" class="msg ok">Tersimpan. Restart...</div>

    <h3>WiFi</h3>
    <label for="wssid">SSID</label>
    <input id="wssid" type="text" maxlength="32" value="IndahMesin-Prod">

    <label for="wpass">Password</label>
    <input id="wpass" type="password" maxlength="64" placeholder="Wajib diisi ulang saat simpan" value="••••••••••••">

    <h3>MQTT</h3>
    <p class="mqtt-info">
      Broker: <b>82.153.226.85:1883</b><br>
      Diatur di firmware (<code>config.ino</code>) — reflash untuk mengubah.
    </p>

    <h3>Identity</h3>
    <label for="mid">Nomor Mesin</label>
    <input id="mid" type="text" maxlength="32" value="RT-001">

    <label for="lpass">Password Login Baru</label>
    <input id="lpass" type="password" maxlength="64" placeholder="Min 6 karakter">

    <button type="button" class="btn-primary" disabled>Simpan</button>
  </div>
</body>
</html>
