<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RetortLogger</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
  <div class="mock-banner">MOCKUP DOKUMENTASI — Tekan <kbd>B</kbd> untuk sembunyikan banner</div>
  <div class="login-box">
    <h2>RetortLogger</h2>
    <form id="loginForm" action="dashboard.html">
      <input id="mid" name="mid" placeholder="Nomor Mesin" value="RT-001" required>
      <input id="pwd" name="pwd" type="password" placeholder="Password" value="retort123" required>
      <button type="submit">Login</button>
    </form>
  </div>
  <script src="js/common.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
